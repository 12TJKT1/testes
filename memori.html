<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kenangan Kelas - Memori</title>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 10px; }
    .upload-box { border: 2px dashed #ccc; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
    .galeri { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    .galeri-item { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
    .galeri-item img { width: 100%; height: 180px; object-fit: cover; display: block; }
    .galeri-item p { padding: 8px; margin: 0; font-size: 14px; text-align: center; }
    button { background: #0070f3; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    button:disabled { background: #ccc; }
  </style>
</head>
<body>

  <h1>📸 Galeri Memori Kelas</h1>

  <!-- Form Upload -->
  <div class="upload-box">
    <h3>Tambah Foto Memori</h3>
    <input type="file" id="fotoInput" accept="image/*"><br><br>
    <input type="text" id="captionInput" placeholder="Tulis catatan/nama (opsional)..." style="width: 80%; padding: 8px;"><br>
    <button id="uploadBtn" onclick="uploadMemori()">Unggah Foto</button>
  </div>

  <!-- Area Galeri -->
  <h2>Semua Memori</h2>
  <div id="galeri" class="galeri"></div>

  <script>
    // 1. Inisialisasi Supabase Client
    const SUPABASE_URL = 'https://zebcqneisaldzmfoqeoq.supabase.co'; // Ganti dengan URL kamu
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplYmNxbmVpc2FsZHptZm9xZW9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NjAzMDgsImV4cCI6MjEwNjUzNjMwOH0.SvjK-yYiXrHVz65m9nbFJsLnejky6k5XOIjnTq5QrAE'; // Ganti dengan ANON KEY kamu
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Fungsi untuk mengambil dan menampilkan foto dari database saat web dibuka
    async function muatMemori() {
      const galeriDiv = document.getElementById('galeri');
      galeriDiv.innerHTML = '<p>Mewadahi memori...</p>';

      const { data, error } = await supabaseClient
        .from('memori')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Gagal mengambil data:', error);
        galeriDiv.innerHTML = '<p>Gagal memuat foto.</p>';
        return;
      }

      galeriDiv.innerHTML = '';
      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'galeri-item';
        card.innerHTML = `
          <img src="${item.image_url}" alt="Memori">
          ${item.caption ? `<p>${item.caption}</p>` : ''}
        `;
        galeriDiv.appendChild(card);
      });
    }

    // 3. Fungsi untuk upload foto ke Storage & simpan link ke Database
    async function uploadMemori() {
      const fileInput = document.getElementById('fotoInput');
      const captionInput = document.getElementById('captionInput');
      const uploadBtn = document.getElementById('uploadBtn');

      const file = fileInput.files[0];
      if (!file) return alert('Pilih foto terlebih dahulu!');

      // Batasi ukuran file maks 5MB
      if (file.size > 5 * 1024 * 1024) {
        return alert('Ukuran foto terlalu besar! Maksimal 5MB.');
      }

      uploadBtn.disabled = true;
      uploadBtn.innerText = 'Mengunggah...';

      try {
        // A. Buat nama file unik
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${fileExt}`;

        // B. Upload file ke Supabase Storage (bucket: memori-foto)
        const { data: storageData, error: storageError } = await supabaseClient
          .storage
          .from('memori-fot')
          .upload(fileName, file);

        if (storageError) throw storageError;

        // C. Ambil Public URL dari file yang di-upload
        const { data: publicUrlData } = supabaseClient
          .storage
          .from('memori-fot')
          .getPublicUrl(fileName);

        const imageUrl = publicUrlData.publicUrl;

        // D. Simpan record URL & Caption ke Tabel Database 'memori'
        const { error: dbError } = await supabaseClient
          .from('memori')
          .insert([
            { image_url: imageUrl, caption: captionInput.value }
          ]);

        if (dbError) throw dbError;

        alert('Foto berhasil ditambahkan ke memori!');
        fileInput.value = '';
        captionInput.value = '';

        // E. Refresh galeri
        muatMemori();

      } catch (err) {
        alert('Terjadi kesalahan: ' + err.message);
        console.error(err);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.innerText = 'Unggah Foto';
      }
    }

    // Jalankan fungsi muatMemori saat halaman selesai diproses
    window.onload = muatMemori;
  </script>
</body>
</html>
